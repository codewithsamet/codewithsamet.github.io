<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeWithSamet - Proje Portfolyosu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased overflow-x-hidden selection:bg-blue-600 selection:text-white">

    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[350px] bg-blue-600/15 blur-[140px] rounded-full pointer-events-none"></div>
    <div class="absolute top-[40%] right-[-10%] w-[400px] h-[400px] bg-indigo-600/10 blur-[150px] rounded-full pointer-events-none"></div>

    <header class="max-w-6xl mx-auto px-6 py-6 flex items-center justify-between relative z-10 border-b border-slate-900/80 backdrop-blur-md">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-blue-500/40">
                <i class="fa-solid fa-code text-white text-lg"></i>
            </div>
            <span class="text-xl font-bold tracking-wide">CodeWith<span class="text-blue-500">Samet</span></span>
        </div>
        <div class="flex items-center space-x-4">
            <a href="https://youtube.com/@CodeWithSamet" target="_blank" class="w-10 h-10 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-400 hover:text-white hover:bg-red-600 transition"><i class="fa-brands fa-youtube text-lg"></i></a>
            <a href="https://github.com/codewithsamet" target="_blank" class="w-10 h-10 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-400 hover:text-white hover:bg-slate-800 transition"><i class="fa-brands fa-github text-lg"></i></a>
        </div>
    </header>

    <section class="max-w-4xl mx-auto px-6 pt-24 pb-16 text-center relative z-10">
        <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight mb-8">
            Kodla, Geliştir ve <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">Keşfet.</span>
        </h1>
        <p class="text-slate-400 text-lg md:text-xl max-w-2xl mx-auto">
            YouTube kanalımda geliştirdiğim tüm açık kaynaklı araçları ve projeleri buradan inceleyebilir, VirusTotal güvenlik raporlarıyla güvenle indirebilirsin.
        </p>
    </section>

    <section class="max-w-6xl mx-auto px-6 py-12 relative z-10">
        <div id="projects-grid" class="grid md:grid-cols-2 gap-8"></div>
    </section>

    <script src="projects.data.js"></script>
    <script>
        const grid = document.getElementById('projects-grid');
        projectsData.forEach(project => {
            const card = document.createElement('div');
            card.className = `group bg-slate-900/40 border border-slate-800/80 p-8 rounded-3xl flex flex-col justify-between hover:border-${project.accentColor}-500/60 hover:bg-slate-900/80 transition-all duration-300 shadow-xl shadow-black/40 relative overflow-hidden`;
            
            let warningHTML = project.warningText ? `
                <div class="mb-6 p-3.5 bg-amber-500/10 border border-amber-500/20 rounded-2xl flex items-start space-x-3 text-xs text-amber-300/90 leading-relaxed">
                    <i class="fa-solid fa-triangle-exclamation text-amber-400 mt-0.5 shrink-0"></i>
                    <span>${project.warningText}</span>
                </div>` : '';

            card.innerHTML = `
                <div>
                    <div class="flex items-center justify-between mb-6">
                        <span class="${project.categoryBg} text-xs font-semibold px-3.5 py-1.5 rounded-full border">${project.category}</span>
                        <span class="text-slate-500 text-sm font-mono">${project.version}</span>
                    </div>
                    <h3 class="text-2xl font-bold mb-3 text-slate-100">${project.title}</h3>
                    <p class="text-slate-400 text-sm leading-relaxed mb-6">${project.description}</p>
                    ${warningHTML}
                </div>
                <div class="space-y-3">
                    <a href="${project.downloadLink}" class="block bg-${project.accentColor}-600 hover:bg-${project.accentColor}-500 text-white text-center py-3.5 rounded-2xl text-sm font-semibold transition">İndir (.exe)</a>
                    <a href="${project.virusTotalLink}" target="_blank" class="block bg-slate-800/60 hover:bg-slate-800 text-slate-300 hover:text-white text-center py-2.5 rounded-xl text-xs font-medium border border-slate-700/60 transition">Güvenlik Raporu</a>
                </div>
            `;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
